services:
  # ---------------------------------------------------------
  # 1. THE FILING CABINET (PostgreSQL Database)
  # ---------------------------------------------------------
  db:
    image: postgres:16.13-alpine
    container_name: kg_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ---------------------------------------------------------
  # 2. THE STICKY NOTE BOARD (Redis - Mandatory for v3.0)
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: kg_redis
    restart: unless-stopped
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  # ---------------------------------------------------------
  # 3. THE MAIN OFFICE (FastAPI Backend)
  # ---------------------------------------------------------
  backend:
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
    container_name: kg_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ../kinetic-guard-backend/app:/app/app

  # ---------------------------------------------------------
  # 4. THE MAILROOM WORKERS (Celery - Mandatory for v3.0)
  # ---------------------------------------------------------
  worker:
    build:
      context: ./docker/worker
      dockerfile: Dockerfile
    container_name: kg_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "-l", "info"]
    volumes:
      - ../kinetic-guard-backend/app:/app/app

  # ---------------------------------------------------------
  # 5. THE WEBSITE (React / Vite Web Frontend)
  # ---------------------------------------------------------
  web:
    build:
      context: ./docker/web
      dockerfile: Dockerfile
    container_name: kg_web
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ../kinetic-guard-web/src:/app/src

  # ---------------------------------------------------------
  # 6. THE DOOR MAN (Nginx Reverse Proxy)
  # ---------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: kg_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - web

# ---------------------------------------------------------
# STORAGE LOCKERS (Volumes that survive container restarts)
# ---------------------------------------------------------
volumes:
  postgres_data:
  redis_data: